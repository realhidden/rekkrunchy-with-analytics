name: build-on-push
on: [push]
jobs:
  # Portable C compressor/decompressor — builds with gcc on any arch.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Roundtrip test
        run: make test

  # x86 self-decompressor + full corpus roundtrip, in the 32-bit toolchain.
  x86-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib nasm
      - name: Corpus test (C codec + x86 asm decoder + x86 filter)
        run: sh test/corpus_test.sh
      - name: x86 filter roundtrip over real .text sections
        run: |
          gcc -O2 -o /tmp/frt test/filter_roundtrip.c src/x86filter.c
          for b in /usr/bin/* /bin/*; do
            objcopy -O binary --only-section=.text "$b" /tmp/t.bin 2>/dev/null || continue
            [ -s /tmp/t.bin ] && /tmp/frt /tmp/t.bin >/dev/null || true
          done
          echo "filter roundtrip sweep done"
