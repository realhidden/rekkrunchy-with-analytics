name: build-on-push
on: [push]
jobs:
  # Portable C compressor/decompressor — builds with gcc on any arch.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Roundtrip test
        run: make test

  # x86 self-decompressor + full corpus roundtrip, in the 32-bit toolchain.
  x86-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib nasm
      - name: Corpus test (C tool + x86 asm decoder)
        run: sh test/corpus_test.sh
